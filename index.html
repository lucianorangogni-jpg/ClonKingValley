<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>King's Valley (Retro MSX 1985) - Phaser TypeScript Clone</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0d0f18;
        color: #e0e0e0;
        font-family: 'Courier New', Courier, monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
      }
      #game-container {
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(230, 180, 40, 0.3);
        border: 4px solid #4a3b2c;
        border-radius: 6px;
        background-color: #000;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: block;
      }
      #instructions {
        margin-top: 12px;
        font-size: 13px;
        color: #a4b3c6;
        text-align: center;
        line-height: 1.5;
        max-width: 800px;
      }
      .badge {
        background: #242b35;
        padding: 2px 6px;
        border-radius: 4px;
        color: #ffd700;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <div id="instructions">
      <span class="badge">King's Valley MSX (1985)</span> |
      <strong>Movimiento:</strong> <span class="badge">A/D</span> o <span class="badge">&larr;/&rarr;</span> |
      <strong>Escaleras:</strong> <span class="badge">W/S</span> o <span class="badge">&uarr;/&darr;</span> |
      <strong>Cavar bloque:</strong> <span class="badge">Espacio + &darr;/&larr;/&rarr;</span> (con pico) |
      <strong>Lanzar cuchillo:</strong> <span class="badge">Espacio</span> |
      <strong>Reiniciar:</strong> <span class="badge">R</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
